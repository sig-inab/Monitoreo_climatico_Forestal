<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitoreo Climático - INAB</title>
    
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
    <script src="https://unpkg.com/esri-leaflet"></script>
    <script src="https://unpkg.com/esri-leaflet-renderers"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #windy { width: 100vw; height: 100vh; }

        /* Barra de variables climáticas */
        #toolbar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(30, 30, 30, 0.88);
            border-radius: 30px;
            padding: 8px 14px;
            display: flex;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        #toolbar button {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        #toolbar button:hover { background: rgba(255,255,255,0.25); }
        #toolbar button.active {
            background: #e84040;
            border-color: #e84040;
            font-weight: bold;
        }

        /* Tooltip de instrucción */
        #hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(30,30,30,0.85);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Barra de variables climáticas -->
    <div id="toolbar">
        <button id="btn-rain"     onclick="setOverlay('rain')">🌧️ Precipitación</button>
        <button id="btn-temp"     onclick="setOverlay('temp')">🌡️ Temperatura</button>
        <button id="btn-wind"     onclick="setOverlay('wind')">💨 Viento</button>
        <button id="btn-clouds"   onclick="setOverlay('clouds')">☁️ Nubes</button>
        <button id="btn-pressure" onclick="setOverlay('pressure')">📊 Presión</button>
    </div>

    <!-- Ayuda al usuario -->
    <div id="hint">📍 Haz clic en cualquier punto del mapa para ver el pronóstico diario</div>

    <!-- Contenedor del Mapa -->
    <div id="windy"></div>

    <script>
        let windyStore = null;
        let windyPicker = null;

        // Cambia la capa activa
        function setOverlay(overlay) {
            if (!windyStore) return;
            const resultado = windyStore.set('overlay', overlay);
            if (resultado) {
                document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
                const btn = document.getElementById('btn-' + overlay);
                if (btn) btn.classList.add('active');
            }
        }

        // Opciones de Windy
        const options = {
            key: 'p7SzpUA9KIIWa1BTSmchBma64F1YC3GC',
            lat: 15.5,
            lon: -90.25,
            zoom: 7,
            verbose: true,
            overlay: 'rain'  // Abre con Precipitación
        };

        // Inicializar el mapa
        windyInit(options, windyAPI => {
            const map = windyAPI.map;
            windyStore  = windyAPI.store;
            windyPicker = windyAPI.picker;

            // Activar botón de Precipitación al inicio
            document.getElementById('btn-rain').classList.add('active');

            // =============================================
            // WEATHER PICKER: Al hacer clic → pronóstico
            // =============================================
            map.on('click', function (e) {
                windyPicker.open({ 
                    lat: e.latlng.lat, 
                    lon: e.latlng.lng 
                });
            });

            // Aquí agregaremos las capas de ArcGIS más adelante

        });
    </script>
</body>
</html>

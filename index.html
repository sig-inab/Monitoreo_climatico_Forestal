<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoreo Climático Forestal — INAB</title>

    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Esri Leaflet -->
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-renderers@3.0.0/dist/esri-leaflet-renderers.js"></script>

    <!-- Leaflet Velocity (Animación de Partículas de Viento tipo Windy) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@2.1.2/dist/leaflet-velocity.css" />
    <script src="https://unpkg.com/leaflet-velocity@2.1.2/dist/leaflet-velocity.js"></script>

    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-dark: rgba(15, 23, 42, 0.94);
            --border-glass: rgba(255, 255, 255, 0.15);
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-pink: #f472b6;
            --text-light: #f8fafc;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #0f172a; }
        #map { width: 100vw; height: 100vh; background: #1e293b; }

        /* Capa GEE Climática Opacidad y Color Vivo */
        .gee-tile-layer {
            opacity: 0.88;
        }

        /* ── MENÚ HAMBURGUESA (CAPAS INAB) ── */
        .hamburger-btn {
            position: absolute;
            top: 70px;
            left: 20px;
            z-index: 1001;
            background: var(--bg-dark);
            color: var(--text-light);
            border: 1px solid var(--border-glass);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease;
        }
        .hamburger-btn:hover { transform: scale(1.05); color: var(--accent-green); }

        .inab-drawer {
            position: absolute;
            top: 125px;
            left: 20px;
            z-index: 1000;
            background: var(--bg-dark);
            color: #fff;
            width: 270px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .inab-drawer.open { display: flex; }
        .inab-drawer h4 { margin: 0 0 6px 0; font-size: 12px; color: var(--accent-green); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }

        .drawer-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }
        .drawer-checkbox-item:hover { background: rgba(255,255,255,0.08); }
        .drawer-checkbox-item input { accent-color: var(--accent-green); cursor: pointer; }

        /* ── BARRA DE LEYENDA FLOTANTE (SUPERIOR CENTRO) ── */
        .legend-bar-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--bg-dark);
            padding: 8px 18px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 320px;
        }
        .legend-title { font-size: 11px; font-weight: 700; color: #e2e8f0; letter-spacing: 0.5px; }
        .legend-gradient-bar {
            width: 100%;
            height: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .legend-ticks {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 10px;
            color: #94a3b8;
            font-weight: 600;
        }

        /* Botón de ocultar/mostrar panel de capas climáticas GEE */
        .gee-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1002;
            background: var(--bg-dark);
            color: var(--accent-blue);
            border: 1px solid var(--border-glass);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }
        .gee-toggle-btn:hover { transform: scale(1.05); color: var(--accent-green); }

        /* ── BARRA LATERAL DERECHA DE VARIABLES GEE (VERTICAL) ── */
        .right-gee-sidebar {
            position: absolute;
            top: 65px;
            right: 15px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-dark);
            padding: 10px 8px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            max-height: calc(85vh - 60px);
            overflow-y: auto;
            width: 185px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .right-gee-sidebar.collapsed {
            display: none !important;
        }

        @media (max-width: 768px) {
            .right-gee-sidebar {
                width: 160px;
                max-height: 55vh;
                top: 65px;
                right: 10px;
            }
            .legend-bar-container {
                min-width: 240px;
                padding: 6px 12px;
                top: 10px;
            }
            .legend-title { font-size: 10px; }
            .legend-ticks { font-size: 9px; }
            .hamburger-btn { top: 15px; left: 15px; }
            .inab-drawer { top: 65px; left: 15px; width: 240px; }
        }

        .gee-btn {
            background: rgba(255,255,255,0.06);
            color: #94a3b8;
            border: 1px solid transparent;
            padding: 7px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .gee-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .gee-btn.active {
            background: var(--accent-blue);
            color: #0f172a;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .gee-btn.anim-btn {
            background: rgba(244, 114, 182, 0.15);
            color: var(--accent-pink);
            border-color: rgba(244, 114, 182, 0.3);
        }
        .gee-btn.anim-btn.active {
            background: var(--accent-pink);
            color: #0f172a;
        }
        .gee-btn.contour-btn {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .gee-btn.contour-btn.active {
            background: rgba(56, 189, 248, 0.2);
            color: #fff;
            border-color: var(--accent-blue);
        }

        /* ── BANDERITA DE VALOR PUNTUAL (ESTILO WINDY FLAG MARKER - LADO IZQUIERDO) ── */
        .windy-flag-container {
            position: relative;
            transform: translate(-105px, -65px);
            pointer-events: auto;
            z-index: 1001;
        }
        .windy-flag-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 6px 12px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
            position: relative;
        }
        .windy-flag-title { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        .windy-flag-value { font-size: 16px; font-weight: 800; color: #fff; margin-top: 2px; }
        .windy-flag-stem {
            width: 2px;
            height: 25px;
            background: rgba(255, 255, 255, 0.8);
            margin: 0 auto;
        }
        .windy-flag-dot {
            width: 10px;
            height: 10px;
            background: #fff;
            border: 2px solid #0f172a;
            border-radius: 50%;
            margin: -5px auto 0 auto;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        /* ── PANEL HORIZONTAL DE PRONÓSTICO PUNTUAL (ABAJO) ── */
        #forecast-panel {
            display: none;
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--bg-dark);
            color: #fff;
            border-radius: 16px;
            padding: 12px 18px;
            width: 80vw;
            max-width: 920px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
        }
        .forecast-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .forecast-title { font-size: 13px; font-weight: 700; color: var(--accent-blue); display: flex; align-items: center; gap: 8px; }
        .forecast-coords { font-size: 11px; color: #94a3b8; }
        .forecast-tabs { display: flex; gap: 6px; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 11px; font-weight: 600; cursor: pointer; padding: 3px 10px; border-radius: 6px; }
        .tab-btn.active { color: #fff; background: rgba(255,255,255,0.15); }
        .close-btn { cursor: pointer; font-size: 16px; color: #94a3b8; margin-left: 10px; }

        .forecast-grid-horizontal {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
        }
        .forecast-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 8px 10px;
            min-width: 95px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .forecast-card .time { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: capitalize; }
        .forecast-card .temp { font-size: 13px; font-weight: 700; color: #f97316; }
        .forecast-card .rain { font-size: 11px; color: #38bdf8; font-weight: 600; }
        .forecast-card .desc { font-size: 10px; color: #cbd5e1; }
        
        /* ── ESTILOS DE POPUPS VECTORIALES SCROLLABLES Y ELEGANTES ── */
        .leaflet-popup-content-wrapper {
            background: var(--bg-dark);
            color: #fff;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }
        .leaflet-popup-tip {
            background: var(--bg-dark);
        }
        .leaflet-popup-content {
            margin: 10px 12px;
            max-height: 190px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.3) transparent;
        }
        .popup-info-box {
            font-size: 11px;
            line-height: 1.6;
            color: #f8fafc;
        }
        .popup-title {
            font-weight: 700;
            font-size: 12px;
            color: var(--accent-blue);
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- MENÚ HAMBURGUESA (CAPAS INAB) -->
    <div class="hamburger-btn" onclick="toggleDrawer()" title="Capas Institucionales INAB">
        <i class="fa-solid fa-bars"></i>
    </div>

    <div class="inab-drawer" id="inabDrawer">
        <h4><i class="fa-solid fa-tree"></i> Capas Institucionales INAB</h4>
        
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkIncentivos" checked onchange="toggleInabLayer('incentivos', this.checked)">
            <span>Incentivos Forestales</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkMunicipios" onchange="toggleInabLayer('municipios', this.checked)">
            <span>Municipios / Subregiones</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkEcosistemas" onchange="toggleInabLayer('ecosistemas', this.checked)">
            <span>Tipos de Ecosistemas</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkRepoblacion" onchange="toggleInabLayer('repoblacion', this.checked)">
            <span>Obligaciones de Repoblación</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkBuffer" checked onchange="toggleInabLayer('buffer', this.checked)">
            <span>Límite Guatemala</span>
        </label>

        <h4 style="margin-top:10px;"><i class="fa-solid fa-mountain"></i> Relieve 3D & Mapa Base</h4>
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkHillshade" checked onchange="toggleHillshade(this.checked)">
            <span>Relieve 3D</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="radio" name="baseRadio" checked onchange="changeBaseMap('sat')">
            <span>Satelital</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="radio" name="baseRadio" onchange="changeBaseMap('topo')">
            <span>Topográfico</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="radio" name="baseRadio" onchange="changeBaseMap('osm')">
            <span>OpenStreetMap</span>
        </label>
    </div>

    <!-- BARRA DE LEYENDA FLOTANTE (SUPERIOR CENTRO) -->
    <div class="legend-bar-container" id="legendContainer">
        <div class="legend-title" id="legendTitle">Precipitación Diaria CHIRPS (mm)</div>
        <div class="legend-gradient-bar" id="legendGradient"></div>
        <div class="legend-ticks" id="legendTicks"></div>
    </div>

    <!-- BOTÓN OCULTAR/MOSTRAR PANEL CLIMÁTICO GEE -->
    <div class="gee-toggle-btn" onclick="toggleGeeSidebar()" title="Mostrar/Ocultar Capas Climáticas">
        <i class="fa-solid fa-cloud-sun"></i>
    </div>

    <!-- BARRA LATERAL DERECHA DE VARIABLES GEE (VERTICAL) -->
    <div class="right-gee-sidebar" id="geeSidebar">
        <button class="gee-btn anim-btn active" id="btnAnimWind" onclick="toggleWindAnimation()">
            <i class="fa-solid fa-wind"></i> Viento Animado
        </button>
        <button class="gee-btn active" onclick="activateGeeLayer('precip')"><i class="fa-solid fa-cloud-rain"></i> Precipitación (mm)</button>
        <button class="gee-btn" onclick="activateGeeLayer('temp')"><i class="fa-solid fa-temperature-high"></i> Temp (°C)</button>
        <button class="gee-btn" onclick="activateGeeLayer('wind')"><i class="fa-solid fa-wind"></i> Viento (kt)</button>
        <button class="gee-btn" onclick="activateGeeLayer('soil')"><i class="fa-solid fa-mound"></i> Humedad Suelo</button>
        <button class="gee-btn" onclick="activateGeeLayer('dew')"><i class="fa-solid fa-droplet"></i> Punto Rocío</button>
        <button class="gee-btn" onclick="activateGeeLayer('precipAccum')"><i class="fa-solid fa-cloud-showers-heavy"></i> Acum Preci Diaria</button>
        <button class="gee-btn" onclick="activateGeeLayer('precipMensual')"><i class="fa-solid fa-calendar-days"></i> Precip Mensual</button>
        <button class="gee-btn" onclick="activateGeeLayer('soilRoot')"><i class="fa-solid fa-plant-wilt"></i> Saturación Suelo (7-28 cm)</button>
        <button class="gee-btn" onclick="activateGeeLayer('ndvi')"><i class="fa-solid fa-leaf"></i> Vigorosidad NDVI</button>
        <button class="gee-btn" onclick="activateGeeLayer('etReal')"><i class="fa-solid fa-water"></i> ET Real</button>
        <button class="gee-btn" onclick="activateGeeLayer('etPot')"><i class="fa-solid fa-sun"></i> ET Potencial</button>
        <button class="gee-btn" onclick="activateGeeLayer('p7d')"><i class="fa-solid fa-cloud-bolt"></i> Pronóstico 7D</button>
        <button class="gee-btn" onclick="activateGeeLayer('p16d')"><i class="fa-solid fa-umbrella"></i> Pronóstico 16D</button>
        <button class="gee-btn" onclick="activateGeeLayer('gaussen')"><i class="fa-solid fa-fire"></i> Déficit Hídrico</button>
        <button class="gee-btn" onclick="activateGeeLayer('estres')"><i class="fa-solid fa-temperature-arrow-up"></i> Estrés Hídrico</button>
        <button class="gee-btn" onclick="activateGeeLayer('martonne')"><i class="fa-solid fa-compass-drafting"></i> Aridez</button>
        <button class="gee-btn" onclick="activateGeeLayer('suscSequia')"><i class="fa-solid fa-triangle-exclamation"></i> Suscep. Sequía</button>
        <button class="gee-btn" onclick="activateGeeLayer('suscHelada')"><i class="fa-solid fa-snowflake"></i> Suscep. Heladas</button>
        
        <!-- CONTORNOS EN LA BARRA DERECHA -->
        <button class="gee-btn contour-btn" id="btnIsotermas" onclick="toggleContour('isotermas')">
            <i class="fa-solid fa-route"></i> Isotermas (2°C)
        </button>
        <button class="gee-btn contour-btn" id="btnIsoyetas" onclick="toggleContour('isoyetas')">
            <i class="fa-solid fa-water"></i> Isoyetas (10mm)
        </button>
    </div>

    <!-- PANEL HORIZONTAL DE PRONÓSTICO PUNTUAL (ABAJO) -->
    <div id="forecast-panel">
        <div class="forecast-header">
            <div class="forecast-title">
                <i class="fa-solid fa-location-dot"></i> Pronóstico Puntual
                <span class="forecast-coords" id="forecast-coords"></span>
            </div>
            <div class="forecast-tabs">
                <button class="tab-btn active" onclick="switchForecastTab('7d')">7 Días</button>
                <button class="tab-btn" onclick="switchForecastTab('16d')">16 Días</button>
                <span class="close-btn" onclick="closeForecast()">✕</span>
            </div>
        </div>

        <div class="forecast-grid-horizontal" id="forecast-grid">
            <div style="color:#aaa; padding:10px; font-size:12px;">Haz clic en cualquier punto del mapa...</div>
        </div>
    </div>

    <!-- MAPA PRINCIPAL -->
    <div id="map"></div>

    <script>
        const BASE_INAB = 'https://sig.inab.gob.gt/server/rest/services/Hosted';

        // 1. DICCIONARIO DE CAPAS GEE (18 URLS OFICIALES)
        const GEE_URLS = {
            precip: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/f7c4423e21021d62923f305c87c7132e-bae1f4c63a8391bc95c4501d313b8737/tiles/{z}/{x}/{y}',
            temp: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/acbbb2e4d7113ed48212df5da5433e50-fc1454bfa9d68c94e91e5c7d1511e090/tiles/{z}/{x}/{y}',
            wind: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/6e86b2edf8a7ce0f9c9ebf04e1149d30-c86a44fffbe870331c75792761ffd6a6/tiles/{z}/{x}/{y}',
            soil: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/b1efa5d6a3f28f1fdaafdaafc06cfc7a-14b9d1c645424093b2ce0e75e9c2dccd/tiles/{z}/{x}/{y}',
            dew: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/66a62663b2f072da10cc2d558ec2ec42-00cc050a6e047a6c259a38e68191ff8e/tiles/{z}/{x}/{y}',
            precipAccum: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/41978bb3bc0c3dde35d541d9fe610f5a-3caaae0274d329d3e27b027843011702/tiles/{z}/{x}/{y}',
            precipMensual: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/582eeb66371c8b04d26430b4b0fa1ce5-ca23ca807a63f05065865ae1c23c5c5a/tiles/{z}/{x}/{y}',
            soilRoot: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/89f78314999eade7fc23bbd7bd2887e2-182e67358da51972385d9662093dce81/tiles/{z}/{x}/{y}',
            ndvi: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/8c0802dfeeb69b6a5e60ebfe6c5a6c88-f13e96c00221174ca76d3e6d264d8d9b/tiles/{z}/{x}/{y}',
            etReal: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/404d1beb29e4ef22aea1d91c15ab362d-f04e63af55303496618e61d35881350a/tiles/{z}/{x}/{y}',
            etPot: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/6ac592bb651c854998b513c0fffae6d0-c45f947306d4a4d7f166f6970d9ad378/tiles/{z}/{x}/{y}',
            p7d: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/f862817014e7cb7ba02006758841dc51-5afcc9f0875def29c0ce05e127494fb2/tiles/{z}/{x}/{y}',
            p16d: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/3efbfdc455b325ae144be7f2d97459f9-44229b672aaf2c13a19ef1ddfbf1a1d7/tiles/{z}/{x}/{y}',
            gaussen: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/8f780f3755ad80189228e655fd3e29d2-6145b450da78505f232e10816fe1f4d8/tiles/{z}/{x}/{y}',
            estres: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/5ced6724ebdbc145a3c583fba5548a2a-cf4467cccb0979bbcb2fb00920ddcb79/tiles/{z}/{x}/{y}',

        // DICCIONARIO COMPLETO DE LEYENDAS Y SIMBOLOGÍAS PARA LAS 18 CAPAS
        const LEGENDS = {

            dew: { title: 'Punto de Rocío ERA5 (°C)', gradient: 'linear-gradient(to right, #d73027, #f46d43, #fdae61, #fee08b, #d9ef8b, #1a9850)', ticks: ['5°', '10°', '15°', '20°', '25°C'], labelName: 'Punto Rocío' },
            precipAccum: { title: 'Precipitación Diaria Acumulada (GFS)', gradient: 'linear-gradient(to right, #e0f3f8, #91bfdb, #67a9cf, #2b8cbe, #045a8d, #023858)', ticks: ['0', '2', '5', '10', '20+ mm'], labelName: 'Precip Acum' },
            precipMensual: { title: 'Precipitación Mensual Acumulada (30d CHIRPS)', gradient: 'linear-gradient(to right, #74add1, #4575b4, #313695, #2b8cbe, #045a8d, #023858)', ticks: ['30', '100', '200', '300+ mm'], labelName: 'Precip Mensual' },
            soilRoot: { title: 'Saturación Suelo (7-28cm)', gradient: 'linear-gradient(to right, #8c510a, #d8b365, #f6e8c3, #c7edd5, #5ab4ac, #01665e)', ticks: ['Seco', 'Medio', 'Saturado'], labelName: 'Suelo Radicular' },

            etReal: { title: 'Evapotranspiración Real ET (mm/8d)', gradient: 'linear-gradient(to right, #fff7ec, #fee8c8, #fdd49e, #fdbb84, #fc8d59, #ef6548, #d7301f, #990000)', ticks: ['0', '10', '20', '30', '40+ mm'], labelName: 'ET Real' },
            etPot: { title: 'Evapotranspiración Potencial PET (mm/8d)', gradient: 'linear-gradient(to right, #fff7ec, #fee8c8, #fdd49e, #fdbb84, #fc8d59, #ef6548, #d7301f, #990000)', ticks: ['0', '10', '20', '30', '40+ mm'], labelName: 'ET Potencial' },
            p7d: { title: 'Pronóstico Lluvia 7 Días (mm)', gradient: 'linear-gradient(to right, #e0f3f8, #91bfdb, #67a9cf, #2b8cbe, #045a8d, #023858)', ticks: ['0', '25', '50', '100', '150+ mm'], labelName: 'Pronóstico 7D' },
            p16d: { title: 'Pronóstico Lluvia 16 Días (mm)', gradient: 'linear-gradient(to right, #e0f3f8, #91bfdb, #67a9cf, #2b8cbe, #045a8d, #023858)', ticks: ['0', '50', '100', '200', '300+ mm'], labelName: 'Pronóstico 16D' },
            gaussen: { title: 'Déficit Hídrico (Índice Ombrotérmico Gaussen)', gradient: 'linear-gradient(to right, #7f0000, #d73027, #f46d43, #fee08b, #e0f3f8, #67a9cf, #023858)', ticks: ['Déficit (-40)', 'Equilibrio (0)', 'Excedente (+20)'], labelName: 'Déficit Gaussen' },
            estres: { title: 'Estrés Hídrico Foliar', gradient: 'linear-gradient(to right, #1a9850, #91cf60, #d9ef8b, #fee08b, #fc8d59, #d73027, #7f0000)', ticks: ['Saludable (0)', 'Estrés Medio', 'Estrés Severo (8)'], labelName: 'Estrés Foliar' },
            martonne: { title: 'Índice de Aridez de De Martonne', gradient: 'linear-gradient(to right, #d7191c, #fdae61, #ffffbf, #abd9e9, #2c7bb6)', ticks: ['Árido (<10)', 'Semiárido', 'Subhúmedo', 'Húmedo (>30)'], labelName: 'Aridez Martonne' },
            suscSequia: { title: 'Susceptibilidad Forestal (Sequías)', gradient: 'linear-gradient(to right, #006837, #31a354, #78c679, #addd8e, #d9ef8b, #fee08b, #fdae61, #f46d43, #d73027, #a50026)', ticks: ['Baja (0.1)', 'Media (0.4)', 'Alta (0.8)'], labelName: 'Vulnerab. Sequía' },
            suscHelada: { title: 'Susceptibilidad Forestal (Heladas)', gradient: 'linear-gradient(to right, #1f6888, #388385, #529688, #80a599, #d4c4b0, #b57448, #a0562e)', ticks: ['< 0° (Severa)', '4° (Moderada)', '> 12° (Sin riesgo)'], labelName: 'Riesgo Helada' }
        };

        // 2. INICIALIZAR MAPA Y UBICAR CONTROLES ZOOM A LA DERECHA ABAJO (SIN SOLAPAR)
        const map = L.map('map', {
            center: [15.5, -90.25],
            zoom: 7,
            maxZoom: 19,
            minZoom: 5,
            zoomControl: false
        });

        // Reubicar controles de Zoom en la esquina inferior derecha
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 3. CAPA DE RELIEVE 3D HILLSHADE (ESRI WORLD HILLSHADE - GRATUITO Y RÁPIDO)
        const hillshadeLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            opacity: 0.65
        }).addTo(map);

        function toggleHillshade(isChecked) {
            if (isChecked) map.addLayer(hillshadeLayer);
            else map.removeLayer(hillshadeLayer);
        }

        // 4. MAPAS BASE
        const baseLayers = {
            sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map),
            topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
        };

        // 5. CAPAS INAB ARCGIS
        const popupOptionsRight = { offset: L.point(85, -25) };

        const inabLayers = {
            buffer: L.esri.featureLayer({ url: `${BASE_INAB}/GuatemalaBuffer1km/FeatureServer/0` }).addTo(map),
            municipios: L.esri.featureLayer({
                url: `${BASE_INAB}/Municipios_SubregionesINAB/FeatureServer/0`,
                style: function() {
                    return {

                        fillOpacity: 0,
                        fill: false
                    };
                }
            }).bindPopup(l => {
                const p = l.feature.properties;
                const depto = p.depto || p.DEPTO || p.departamento || '-';
                const muni = p.municipio || p.MUNICIPIO || p.mun || '-';
                const subreg = p.codsubreg || p.CODSUBREG || p.subregion || p.codreg || '-';
                const formattedSubreg = subreg !== '-' ? subreg.toUpperCase().replace('_', '-') : '-';
                return `
                    <div class="popup-info-box">
                        <div class="popup-title">🗺️ ${muni}</div>
                        <b>📍 Departamento:</b> ${depto}<br>
                        <b>🏛️ Municipio:</b> ${muni}<br>
                        <b>🌿 Subregión INAB:</b> ${formattedSubreg}
                    </div>
                `;
            }, popupOptionsRight),
            incentivos: L.esri.featureLayer({
                url: `${BASE_INAB}/Incentivos_Forestales_INAB_Clima_vista/FeatureServer/0`,
                style: function() {
                    return { 
                        color: '#9333ea',        // Borde Morado / Púrpura Intenso (Alto Contraste)
                        weight: 2, 
                        fillColor: '#c084fc',    // Relleno Violeta Claro
                        fillOpacity: 0.45 
                    };
                }
            }).bindPopup(l => {
                const p = l.feature.properties;
                return `
                    <div class="popup-info-box">
                        <div class="popup-title">🌲 Incentivo Forestal</div>
                        <b>Programa:</b> ${p.programa || '-'}<br>
                        <b>Expediente:</b> ${p.expediente || '-'}<br>
                        <b>Modalidad:</b> ${p.modalidad || '-'}<br>
                        <b>Tipo Proyecto:</b> ${p.tipoproyec || '-'}<br>
                        <b>Estado Proyecto:</b> ${p.estado_proyecto || '-'}<br>
                        <b>Especies:</b> ${p.especies_concat || '-'}
                    </div>
                `;
            }, popupOptionsRight).addTo(map),
            ecosistemas: L.esri.featureLayer({
                url: `${BASE_INAB}/TipoEcosistemasGuatemala_Geo/FeatureServer/1`,
                style: function() {
                    return { 
                        color: '#0284c7',        // Borde Azul Cian
                        weight: 1.5, 
                        fillColor: '#38bdf8',    // Relleno Cian Celeste
                        fillOpacity: 0.3 
                    };
                }
            }).bindPopup(l => {
                const p = l.feature.properties;
                return `
                    <div class="popup-info-box">
                        <div class="popup-title">🌳 Ecosistema</div>
                        <b>Tipo Ecosistema:</b> ${p.tipoecosistema || '-'}
                    </div>
                `;
            }, popupOptionsRight),
            repoblacion: L.esri.featureLayer({
                url: `${BASE_INAB}/Obligaciones_de_Repoblaci%C3%B3n_Forestal/FeatureServer/1`,
                style: function() {
                    return { 
                        color: '#c026d3',        // Borde Magenta / Fucsia Intenso (Alto Contraste)
                        weight: 2, 
                        fillColor: '#e879f9',    // Relleno Magenta Claro
                        fillOpacity: 0.45 
                    };
                }
            }).bindPopup(l => {
                const p = l.feature.properties;
                const areaStr = p.area_obligacion ? parseFloat(p.area_obligacion).toFixed(2) + ' ha' : '-';
                return `
                    <div class="popup-info-box">
                        <div class="popup-title">📜 Repoblación Forestal</div>
                        <b>Expediente:</b> ${p.codigo_expediente || '-'}<br>
                        <b>Estado:</b> ${p.estado || '-'}<br>
                        <b>Tipo Obligación:</b> ${p.tipo_obligacion || '-'}<br>
                        <b>Área Obligación:</b> ${areaStr}
                    </div>
                `;
            }, popupOptionsRight)
        };

        // 6. ANIMACIÓN GLOBAL Y LIGERA DE VIENTO (ESTILO WINDY PLANETARIO)
        let velocityLayer = null;
        let windAnimActive = true;

        const globalWindData = [{
            header: {
                parameterCategory: 2, parameterNumber: 2,
                nx: 36, ny: 18, basicAngle: 0, subDivisions: 0,
                lo1: -180.0, la1: 85.0, lo2: 180.0, la2: -85.0,
                dx: 10.0, dy: 10.0, date: "2026-09-28T18:00:00Z"
            },
            data: Array(648).fill(-4.2)
        }, {
            header: {
                parameterCategory: 2, parameterNumber: 3,
                nx: 36, ny: 18, basicAngle: 0, subDivisions: 0,
                lo1: -180.0, la1: 85.0, lo2: 180.0, la2: -85.0,
                dx: 10.0, dy: 10.0, date: "2026-09-28T18:00:00Z"
            },
            data: Array(648).fill(-1.5)
        }];

        function initWindAnimation() {
            velocityLayer = L.velocityLayer({
                displayValues: false,
                data: globalWindData,
                maxVelocity: 12,
                velocityScale: 0.003,
                particleAge: 140,
                particleMultiplier: 1 / 2500,
                lineWidth: 1.2,
                particleColor: '#e0f2fe',
                opacity: 0.65
            }).addTo(map);
        }

        function toggleWindAnimation() {
            windAnimActive = !windAnimActive;
            const btn = document.getElementById('btnAnimWind');
            btn.classList.toggle('active', windAnimActive);
            
            if (windAnimActive) {
                if (!velocityLayer) initWindAnimation();
                else map.addLayer(velocityLayer);
            } else {
                if (velocityLayer) map.removeLayer(velocityLayer);
            }
        }

        initWindAnimation();

        // 7. CONTROL DE CAPA GEE ACTIVA
        let currentGeeLayer = null;
        let activeGeeKey = 'precip';

        function activateGeeLayer(key) {
            if (currentGeeLayer) map.removeLayer(currentGeeLayer);
            
            activeGeeKey = key;
            currentGeeLayer = L.tileLayer(GEE_URLS[key], { 
                opacity: 0.88, 
                maxZoom: 19,
                className: 'gee-tile-layer'
            }).addTo(map);

            document.querySelectorAll('.right-gee-sidebar .gee-btn:not(.anim-btn):not(.contour-btn)').forEach(btn => btn.classList.remove('active'));
            if (typeof event !== 'undefined' && event && event.currentTarget) event.currentTarget.classList.add('active');

            updateLegend(key);
        }

        function updateLegend(key) {
            const leg = LEGENDS[key] || { title: `Capa Climática: ${key}`, gradient: 'linear-gradient(to right, #000, #fff)', ticks: ['Min', 'Max'] };
            document.getElementById('legendTitle').textContent = leg.title;
            document.getElementById('legendGradient').style.background = leg.gradient;
            
            const ticksHtml = leg.ticks.map(t => `<span>${t}</span>`).join('');
            document.getElementById('legendTicks').innerHTML = ticksHtml;
        }

        activateGeeLayer('precip');

        // 8. LÓGICA DE CONTORNOS
        let isotermasActive = false;
        let isoyetasActive = false;

        function toggleContour(type) {
            if (type === 'isotermas') {
                isotermasActive = !isotermasActive;
                document.getElementById('btnIsotermas').classList.toggle('active', isotermasActive);
            } else {
                isoyetasActive = !isoyetasActive;
                document.getElementById('btnIsoyetas').classList.toggle('active', isoyetasActive);
            }
        }

        // 9. MENÚ HAMBURGUESA Y CAPAS INAB
        function toggleDrawer() {
            document.getElementById('inabDrawer').classList.toggle('open');
        }

        function toggleGeeSidebar() {
            document.getElementById('geeSidebar').classList.toggle('collapsed');
        }

        function toggleInabLayer(layerKey, isChecked) {
            if (isChecked) map.addLayer(inabLayers[layerKey]);
            else map.removeLayer(inabLayers[layerKey]);
        }

        function changeBaseMap(key) {
            Object.values(baseLayers).forEach(l => map.removeLayer(l));
            baseLayers[key].addTo(map);
        }

        // 10. BANDERITA DE VALOR PUNTUAL (WINDY STYLE FLAG MARKER) & PRONÓSTICO PUNTUAL HORIZONTAL
        let currentClickLat = null;
        let currentClickLon = null;
        let flagMarker = null;

        function closeForecast() {
            document.getElementById('forecast-panel').style.display = 'none';
            if (flagMarker) {
                map.removeLayer(flagMarker);
                flagMarker = null;
            }
        }

        function switchForecastTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (typeof event !== 'undefined' && event && event.target) event.target.classList.add('active');
            fetchForecastData(currentClickLat, currentClickLon, tab);
        }

        function handlePointSelection(lat, lon) {
            currentClickLat = lat;
            currentClickLon = lon;
            
            document.getElementById('forecast-panel').style.display = 'block';
            document.getElementById('forecast-coords').textContent = `Lat: ${currentClickLat.toFixed(4)}, Lon: ${currentClickLon.toFixed(4)}`;
            
            fetchForecastData(currentClickLat, currentClickLon, '7d');
        }

        map.on('click', function(e) {
            handlePointSelection(e.latlng.lat, e.latlng.lng);
        });

        // Permitir que al hacer clic sobre cualquier polígono vectorial del INAB también se genere la banderita y el pronóstico
        Object.values(inabLayers).forEach(layer => {
            layer.on('click', function(e) {
                if (e.latlng) {
                    handlePointSelection(e.latlng.lat, e.latlng.lng);
                }
            });
        });

        function getWmoWeatherText(code) {
            if (code === 0) return 'Despejado';
            if (code >= 1 && code <= 3) return 'Nublado';
            if (code === 45 || code === 48) return 'Niebla';
            if (code >= 51 && code <= 55) return 'Llovizna';
            if (code >= 61 && code <= 65) return 'Lluvia';
            if (code >= 80 && code <= 82) return 'Chubascos';
            if (code >= 95) return 'Tormenta eléctrica';
            return 'Lluvia ligera';
        }

        async function fetchForecastData(lat, lon, range) {
            const grid = document.getElementById('forecast-grid');
            grid.innerHTML = '<div style="color:#aaa; padding:10px; font-size:12px;">Cargando datos del punto...</div>';

            const daysCount = range === '7d' ? 7 : 16;
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,dew_point_2m,wind_speed_10m,soil_moisture_0_to_7cm,soil_moisture_7_to_28cm&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code&forecast_days=${daysCount}&timezone=auto`);
                if (!res.ok) throw new Error('Error al consultar API');
                const data = await res.json();
                
                const current = data.current || {};
                const daily = data.daily || {};
                if (!daily || !daily.time) throw new Error('Datos no disponibles');

                const tempVal = current.temperature_2m !== undefined ? current.temperature_2m : (daily.temperature_2m_max[0] + daily.temperature_2m_min[0]) / 2;
                const humVal = current.relative_humidity_2m !== undefined ? current.relative_humidity_2m : 70;
                const rainVal = daily.precipitation_sum[0] || 0;
                const windKt = current.wind_speed_10m !== undefined ? (current.wind_speed_10m * 0.539957).toFixed(1) : '5.0';
                const soil1Pct = current.soil_moisture_0_to_7cm !== undefined ? (current.soil_moisture_0_to_7cm * 100).toFixed(1) : '35.0';
                const soil2Pct = current.soil_moisture_7_to_28cm !== undefined ? (current.soil_moisture_7_to_28cm * 100).toFixed(1) : '38.0';
                const dewVal = current.dew_point_2m !== undefined ? Math.round(current.dew_point_2m) : Math.round(tempVal - 4);

                const liveTemp = Math.round(tempVal) + '°C';
                const liveRain = rainVal.toFixed(1) + ' mm';
                const activeLabel = (LEGENDS[activeGeeKey] && LEGENDS[activeGeeKey].labelName) || 'Valor';
                
                let flagValue = liveTemp;

                if (activeGeeKey === 'precip' || activeGeeKey === 'precipAccum' || activeGeeKey === 'precipMensual' || activeGeeKey.includes('p7d') || activeGeeKey.includes('p16d')) {
                    flagValue = liveRain;
                } else if (activeGeeKey === 'temp') {
                    flagValue = liveTemp;
                } else if (activeGeeKey === 'wind') {
                    flagValue = windKt + ' kt';
                } else if (activeGeeKey === 'soil') {
                    flagValue = soil1Pct + '%';
                } else if (activeGeeKey === 'soilRoot') {
                    flagValue = soil2Pct + '%';
                } else if (activeGeeKey === 'dew') {
                    flagValue = dewVal + '°C';
                } else if (activeGeeKey === 'ndvi') {
                    const calculatedNdvi = Math.min(0.88, Math.max(0.12, 0.25 + (soil1Pct / 160) + (humVal / 300))).toFixed(2);
                    flagValue = calculatedNdvi + ' NDVI';
                } else if (activeGeeKey === 'etReal') {
                    flagValue = (10 + (tempVal * 0.7) + (rainVal * 0.2)).toFixed(1) + ' mm';
                } else if (activeGeeKey === 'etPot') {
                    flagValue = (20 + (tempVal * 1.1)).toFixed(1) + ' mm';
                } else if (activeGeeKey === 'gaussen') {
                    const gVal = (rainVal - 2 * tempVal).toFixed(1);
                    flagValue = gVal + (gVal < 0 ? ' (Déficit)' : ' (Superávit)');
               } else if (activeGeeKey === 'estres') {
                    const soilAvg = (parseFloat(soil1Pct) + parseFloat(soil2Pct)) / 2;
                    const estresVal = Math.max(0, Math.min(8.0, (36 - soilAvg) * 0.45)).toFixed(1);
                    const estresLabel = estresVal < 2.5 ? 'Saludable' : (estresVal < 5.5 ? 'Medio' : 'Severo');
                    flagValue = `${estresLabel} (${estresVal})`;
                } else if (activeGeeKey === 'martonne') {
                    const mVal = ((rainVal * 12) / (tempVal + 10)).toFixed(1);
                    flagValue = mVal + ' (Índice)';
                } else if (activeGeeKey === 'suscSequia') {
                    const soilAvg = (parseFloat(soil1Pct) + parseFloat(soil2Pct)) / 2;
                    const droughtScore = Math.max(0.08, Math.min(0.95, (38 - soilAvg) * 0.035)).toFixed(2);
                    const dLabel = droughtScore > 0.6 ? 'Alta' : (droughtScore > 0.3 ? 'Media' : 'Baja');
                    flagValue = `${dLabel} (${droughtScore})`;
                } else if (activeGeeKey === 'suscHelada') {
                    const minTempToday = daily.temperature_2m_min[0];
                    flagValue = minTempToday < 4 ? `< 4°C (Riesgo Alto)` : (minTempToday < 10 ? `${minTempToday}°C (Moderado)` : `> 12°C (Sin Riesgo)`);
                }

                // Crear o actualizar la Banderita de Valor tipo Windy sobre el punto
                const flagHtml = `
                    <div class="windy-flag-container">
                        <div class="windy-flag-box">
                            <div class="windy-flag-title">${activeLabel}</div>
                            <div class="windy-flag-value">${flagValue}</div>
                        </div>
                        <div class="windy-flag-stem"></div>
                        <div class="windy-flag-dot"></div>
                    </div>
                `;

                const flagIcon = L.divIcon({
                    html: flagHtml,
                    className: '',
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });

                if (flagMarker) map.removeLayer(flagMarker);
                flagMarker = L.marker([lat, lon], { icon: flagIcon }).addTo(map);

                let cards = '';
                for (let i = 0; i < daily.time.length; i++) {
                    const parts = daily.time[i].split('-');
                    const dObj = new Date(parts[0], parts[1] - 1, parts[2]);
                    const dayName = i === 0 ? 'Hoy' : dObj.toLocaleDateString('es-GT', { weekday: 'short', day: 'numeric', month: 'short' });
                    
                    const maxT = Math.round(daily.temperature_2m_max[i]);
                    const minT = Math.round(daily.temperature_2m_min[i]);
                    const rainSum = daily.precipitation_sum[i].toFixed(1);
                    const desc = getWmoWeatherText(daily.weather_code[i]);
                    
                    cards += `
                        <div class="forecast-card">
                            <div class="time">${dayName}</div>
                            <div class="temp">${maxT}° / ${minT}°C</div>
                            <div class="rain">${rainSum} mm</div>
                            <div class="desc">${desc}</div>
                        </div>
                    `;
                }
                grid.innerHTML = cards;
            } catch (err) {
                grid.innerHTML = '<div style="color:#ef4444; padding:10px; font-size:12px;">Error al consultar el pronóstico</div>';
            }
        }
    </script>
</body>
</html>

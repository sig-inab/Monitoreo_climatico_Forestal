<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoreo Climático Forestal — INAB</title>

    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Esri Leaflet -->
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-renderers@3.0.0/dist/esri-leaflet-renderers.js"></script>

    <!-- Leaflet Velocity (Animación de Partículas de Viento tipo Windy) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@2.1.2/dist/leaflet-velocity.css" />
    <script src="https://unpkg.com/leaflet-velocity@2.1.2/dist/leaflet-velocity.js"></script>

    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-dark: rgba(15, 23, 42, 0.94);
            --border-glass: rgba(255, 255, 255, 0.15);
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-pink: #f472b6;
            --text-light: #f8fafc;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #0f172a; }
        #map { width: 100vw; height: 100vh; background: #1e293b; }

        /* Efecto de Mezcla para Relieve Hillshade */
        .leaflet-tile-pane .leaflet-layer {
            mix-blend-mode: normal;
        }
        .gee-tile-layer {
            mix-blend-mode: multiply; /* Mezcla el clima con las sombras 3D del relieve */
        }

        /* ── MENÚ HAMBURGUESA (CAPAS INAB) ── */
        .hamburger-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: var(--bg-dark);
            color: var(--text-light);
            border: 1px solid var(--border-glass);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease;
        }
        .hamburger-btn:hover { transform: scale(1.05); color: var(--accent-green); }

        .inab-drawer {
            position: absolute;
            top: 65px;
            left: 15px;
            z-index: 1000;
            background: var(--bg-dark);
            color: #fff;
            width: 270px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .inab-drawer.open { display: flex; }
        .inab-drawer h4 { margin: 0 0 6px 0; font-size: 12px; color: var(--accent-green); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }

        .drawer-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }
        .drawer-checkbox-item:hover { background: rgba(255,255,255,0.08); }
        .drawer-checkbox-item input { accent-color: var(--accent-green); cursor: pointer; }

        /* ── BARRA DE LEYENDA FLOTANTE (SUPERIOR CENTRO) ── */
        .legend-bar-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--bg-dark);
            padding: 8px 18px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 320px;
        }
        .legend-title { font-size: 11px; font-weight: 700; color: #e2e8f0; letter-spacing: 0.5px; }
        .legend-gradient-bar {
            width: 100%;
            height: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .legend-ticks {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 10px;
            color: #94a3b8;
            font-weight: 600;
        }

        /* ── BARRA LATERAL DERECHA DE VARIABLES GEE (VERTICAL) ── */
        .right-gee-sidebar {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-dark);
            padding: 10px 8px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            max-height: 85vh;
            overflow-y: auto;
            width: 185px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }

        .gee-btn {
            background: rgba(255,255,255,0.06);
            color: #94a3b8;
            border: 1px solid transparent;
            padding: 7px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .gee-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .gee-btn.active {
            background: var(--accent-blue);
            color: #0f172a;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .gee-btn.anim-btn {
            background: rgba(244, 114, 182, 0.15);
            color: var(--accent-pink);
            border-color: rgba(244, 114, 182, 0.3);
        }
        .gee-btn.anim-btn.active {
            background: var(--accent-pink);
            color: #0f172a;
        }
        .gee-btn.contour-btn {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .gee-btn.contour-btn.active {
            background: rgba(56, 189, 248, 0.2);
            color: #fff;
            border-color: var(--accent-blue);
        }

        /* ── PANEL HORIZONTAL DE PRONÓSTICO PUNTUAL (ABAJO) ── */
        #forecast-panel {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--bg-dark);
            color: #fff;
            border-radius: 16px;
            padding: 12px 18px;
            width: 82vw;
            max-width: 950px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
        }
        .forecast-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .forecast-title { font-size: 13px; font-weight: 700; color: var(--accent-blue); display: flex; align-items: center; gap: 8px; }
        .forecast-coords { font-size: 11px; color: #94a3b8; }
        .forecast-tabs { display: flex; gap: 6px; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 11px; font-weight: 600; cursor: pointer; padding: 3px 10px; border-radius: 6px; }
        .tab-btn.active { color: #fff; background: rgba(255,255,255,0.15); }
        .close-btn { cursor: pointer; font-size: 16px; color: #94a3b8; margin-left: 10px; }

        .forecast-grid-horizontal {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
        }
        .forecast-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 8px 10px;
            min-width: 90px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .forecast-card .time { font-size: 10px; color: #94a3b8; font-weight: 600; }
        .forecast-card .temp { font-size: 14px; font-weight: 700; color: #f97316; }
        .forecast-card .rain { font-size: 11px; color: #38bdf8; font-weight: 600; }
        .forecast-card .desc { font-size: 10px; color: #cbd5e1; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <!-- MENÚ HAMBURGUESA (CAPAS INAB) -->
    <div class="hamburger-btn" onclick="toggleDrawer()" title="Capas Institucionales INAB">
        <i class="fa-solid fa-bars"></i>
    </div>

    <div class="inab-drawer" id="inabDrawer">
        <h4><i class="fa-solid fa-tree"></i> Capas Institucionales INAB</h4>
        
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkIncentivos" checked onchange="toggleInabLayer('incentivos', this.checked)">
            <span>🌲 Incentivos Forestales</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkMunicipios" onchange="toggleInabLayer('municipios', this.checked)">
            <span>🗺️ Municipios / Subregiones</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkSequias" onchange="toggleInabLayer('sequias', this.checked)">
            <span>🌵 Susceptibilidad a Sequías (/17)</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkBuffer" checked onchange="toggleInabLayer('buffer', this.checked)">
            <span>🇬🇹 Límite Guatemala (Buffer 1km)</span>
        </label>

        <h4 style="margin-top:10px;"><i class="fa-solid fa-mountain"></i> Relieve 3D & Mapa Base</h4>
        <label class="drawer-checkbox-item">
            <input type="checkbox" id="chkHillshade" checked onchange="toggleHillshade(this.checked)">
            <span>⛰️ Relieve 3D (Hillshade)</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="radio" name="baseRadio" checked onchange="changeBaseMap('sat')">
            <span>🛰️ Esri Satelital</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="radio" name="baseRadio" onchange="changeBaseMap('topo')">
            <span>🗺️ Esri Topográfico</span>
        </label>
        <label class="drawer-checkbox-item">
            <input type="radio" name="baseRadio" onchange="changeBaseMap('osm')">
            <span>🌐 OpenStreetMap</span>
        </label>
    </div>

    <!-- BARRA DE LEYENDA FLOTANTE (SUPERIOR CENTRO) -->
    <div class="legend-bar-container" id="legendContainer">
        <div class="legend-title" id="legendTitle">🌧️ Precipitación Diaria CHIRPS (mm)</div>
        <div class="legend-gradient-bar" id="legendGradient"></div>
        <div class="legend-ticks" id="legendTicks"></div>
    </div>

    <!-- BARRA LATERAL DERECHA DE VARIABLES GEE (VERTICAL) -->
    <div class="right-gee-sidebar" id="geeSidebar">
        <button class="gee-btn anim-btn active" id="btnAnimWind" onclick="toggleWindAnimation()">
            <i class="fa-solid fa-wind"></i> Viento Animado
        </button>
        <button class="gee-btn active" onclick="activateGeeLayer('precip')"><i class="fa-solid fa-cloud-rain"></i> Lluvia CHIRPS</button>
        <button class="gee-btn" onclick="activateGeeLayer('temp')"><i class="fa-solid fa-temperature-high"></i> Temp (°C)</button>
        <button class="gee-btn" onclick="activateGeeLayer('wind')"><i class="fa-solid fa-wind"></i> Viento (kt)</button>
        <button class="gee-btn" onclick="activateGeeLayer('soil')"><i class="fa-solid fa-mound"></i> Humedad Suelo</button>
        <button class="gee-btn" onclick="activateGeeLayer('dew')"><i class="fa-solid fa-droplet"></i> Punto Rocío</button>
        <button class="gee-btn" onclick="activateGeeLayer('precipAccum')"><i class="fa-solid fa-cloud-showers-heavy"></i> Precip Acum Diaria</button>
        <button class="gee-btn" onclick="activateGeeLayer('precipMensual')"><i class="fa-solid fa-calendar-days"></i> Precip Mensual</button>
        <button class="gee-btn" onclick="activateGeeLayer('soilRoot')"><i class="fa-solid fa-plant-wilt"></i> Suelo Radicular</button>
        <button class="gee-btn" onclick="activateGeeLayer('ndvi')"><i class="fa-solid fa-leaf"></i> Salud NDVI</button>
        <button class="gee-btn" onclick="activateGeeLayer('etReal')"><i class="fa-solid fa-water"></i> ET Real</button>
        <button class="gee-btn" onclick="activateGeeLayer('etPot')"><i class="fa-solid fa-sun"></i> ET Potencial</button>
        <button class="gee-btn" onclick="activateGeeLayer('p7d')"><i class="fa-solid fa-cloud-bolt"></i> Pronóstico 7D</button>
        <button class="gee-btn" onclick="activateGeeLayer('p16d')"><i class="fa-solid fa-umbrella"></i> Pronóstico 16D</button>
        <button class="gee-btn" onclick="activateGeeLayer('gaussen')"><i class="fa-solid fa-fire"></i> Déficit Gaussen</button>
        <button class="gee-btn" onclick="activateGeeLayer('estres')"><i class="fa-solid fa-temperature-arrow-up"></i> Estrés Foliar</button>
        <button class="gee-btn" onclick="activateGeeLayer('martonne')"><i class="fa-solid fa-compass-drafting"></i> Aridez Martonne</button>
        <button class="gee-btn" onclick="activateGeeLayer('suscSequia')"><i class="fa-solid fa-triangle-exclamation"></i> Suscep. Sequía</button>
        <button class="gee-btn" onclick="activateGeeLayer('suscHelada')"><i class="fa-solid fa-snowflake"></i> Suscep. Heladas</button>
        
        <!-- CONTORNOS EN LA BARRA DERECHA -->
        <button class="gee-btn contour-btn" id="btnIsotermas" onclick="toggleContour('isotermas')">
            <i class="fa-solid fa-route"></i> Isotermas (2°C)
        </button>
        <button class="gee-btn contour-btn" id="btnIsoyetas" onclick="toggleContour('isoyetas')">
            <i class="fa-solid fa-water"></i> Isoyetas (10mm)
        </button>
    </div>

    <!-- PANEL HORIZONTAL DE PRONÓSTICO PUNTUAL (ABAJO) -->
    <div id="forecast-panel">
        <div class="forecast-header">
            <div class="forecast-title">
                <i class="fa-solid fa-location-dot"></i> Pronóstico Puntual
                <span class="forecast-coords" id="forecast-coords"></span>
            </div>
            <div class="forecast-tabs">
                <button class="tab-btn active" onclick="switchForecastTab('7d')">7 Días</button>
                <button class="tab-btn" onclick="switchForecastTab('16d')">16 Días</button>
                <span class="close-btn" onclick="closeForecast()">✕</span>
            </div>
        </div>

        <div class="forecast-grid-horizontal" id="forecast-grid">
            <div style="color:#aaa; padding:10px; font-size:12px;">Haz clic en cualquier punto del mapa...</div>
        </div>
    </div>

    <!-- MAPA PRINCIPAL -->
    <div id="map"></div>

    <script>
        const OWM_KEY = 'afbf7f009aa64d9a8b52ecd837be74f1';
        const BASE_INAB = 'https://sig.inab.gob.gt/server/rest/services/Hosted';

        // 1. DICCIONARIO DE CAPAS GEE (18 URLS OFICIALES)
        const GEE_URLS = {
            precip: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/2b3f585695c18dcfc19a137a02bd7bae-e6bdb9ba6a7cae420f831196086afdac/tiles/{z}/{x}/{y}',
            temp: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/516b664b749116dc20e37ca0ded3c18b-0947913fe495b5cf0dd0cab03b437821/tiles/{z}/{x}/{y}',
            wind: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/054faaf606efd1d6d547252326929ce7-5728e80dea08cf7e4495640916ab1a13/tiles/{z}/{x}/{y}',
            soil: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/08a8ebde0c79aef22385177bdaca2d33-fba75e614eca65ba736e45986ef83a06/tiles/{z}/{x}/{y}',
            dew: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/89963e81ee1ba1573d464cd8bb5babc0-1cd70da80b1d2cc4569e741b7b609e98/tiles/{z}/{x}/{y}',
            precipAccum: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/7071ad750199992faf335fbf4d51eb25-8d34779a7b3eeb68e515e0e54eec44fb/tiles/{z}/{x}/{y}',
            precipMensual: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/ad89c718ae88111a1ddbdaf3c455dc53-513774da2db907517e746ca03c6645ad/tiles/{z}/{x}/{y}',
            soilRoot: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/0ef48ffc5eddc9549c6100c82607cd78-f3e3e42477cce28981fe9edb5bee09c5/tiles/{z}/{x}/{y}',
            ndvi: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/af9e0b14033c2c035d9d62c883939604-49e26c1fba22ba2e806a28a0a12130e2/tiles/{z}/{x}/{y}',
            etReal: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/b358495cb7c42d9d03dd2ecdfb3b2e21-cd0dc0e0d375450728bce48843c577e3/tiles/{z}/{x}/{y}',
            etPot: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/e97ca01811e7c500b6871c2897a4731c-5fc0923aac6a0cb1fa51e829b3f44872/tiles/{z}/{x}/{y}',
            p7d: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/d2c866c950aacfe69f2a7ea4dc39b65b-29195b6b1b915e82d654b3de0851bbc3/tiles/{z}/{x}/{y}',
            p16d: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/7ea1d8f5422c2ff33a83de518358ebac-f04b1780e10c174f1bf70609c35bc228/tiles/{z}/{x}/{y}',
            gaussen: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/c8d28d01b7b0326dc047b0904c650a34-d81419ac3866c8ae64448dba362b87c1/tiles/{z}/{x}/{y}',
            estres: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/aca9a28f9c805c208a28e532869b6b51-776f51929f9cb68ccf915b068f0adef9/tiles/{z}/{x}/{y}',
            martonne: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/e9459732b5fcf51d66b21c5f540b1e9e-c0f820fb09139b32b29b740abe61fc76/tiles/{z}/{x}/{y}',
            suscSequia: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/b4b0e3ee9cf7dea3244af743de1e0413-7225e55e5776bbeb82bcb34008ff8f1c/tiles/{z}/{x}/{y}',
            suscHelada: 'https://earthengine.googleapis.com/v1/projects/monitoreoclimaticoforestal/maps/35fd72f45b5ca31bd142567d1ea11efc-958718752874349d76af5657d1087faf/tiles/{z}/{x}/{y}'
        };

        // DICCIONARIO COMPLETO DE LEYENDAS Y SIMBOLOGÍAS PARA LAS 18 CAPAS
        const LEGENDS = {
            precip: { title: '🌧️ Precipitación Diaria CHIRPS (mm)', gradient: 'linear-gradient(to right, #e0f3f8, #91bfdb, #67a9cf, #2b8cbe, #045a8d, #023858)', ticks: ['0', '5', '10', '20', '30+ mm'] },
            temp: { title: '🌡️ Temperatura ERA5 (°C)', gradient: 'linear-gradient(to right, #ffffcc, #ffea46, #ffaa00, #ff5500, #e60000, #990000)', ticks: ['12°', '18°', '24°', '30°', '36°C'] },
            wind: { title: '💨 Viento GFS (Nudos kt)', gradient: 'linear-gradient(to right, #5e4fa2, #3288bd, #66c2a5, #abdda4, #e6f598, #fee08b, #f46d43, #9e0142)', ticks: ['0', '5', '10', '20', '35+ kt'] },
            soil: { title: '🪵 Humedad Suelo Superficial ERA5 (0-7cm)', gradient: 'linear-gradient(to right, #8c510a, #d8b365, #f6e8c3, #c7edd5, #5ab4ac, #01665e)', ticks: ['Seco', 'Medio', 'Saturado'] },
            dew: { title: '💧 Punto de Rocío ERA5 (°C)', gradient: 'linear-gradient(to right, #d73027, #f46d43, #fdae61, #fee08b, #d9ef8b, #1a9850)', ticks: ['5°', '10°', '15°', '20°', '25°C'] },
            precipAccum: { title: '🌧️ Tasa Precipitación Diaria (GFS)', gradient: 'linear-gradient(to right, #e0f3f8, #91bfdb, #67a9cf, #2b8cbe, #045a8d, #023858)', ticks: ['0', '2', '5', '10', '20+ mm'] },
            precipMensual: { title: '🌧️ Precipitación Acumulada Mensual (30d CHIRPS)', gradient: 'linear-gradient(to right, #74add1, #4575b4, #313695, #2b8cbe, #045a8d, #023858)', ticks: ['30', '100', '200', '300+ mm'] },
            soilRoot: { title: '🌱 Humedad Suelo Radicular (7-28cm)', gradient: 'linear-gradient(to right, #8c510a, #d8b365, #f6e8c3, #c7edd5, #5ab4ac, #01665e)', ticks: ['Seco', 'Medio', 'Saturado'] },
            ndvi: { title: '🍃 Salud Forestal NDVI (Biomasa)', gradient: 'linear-gradient(to right, #ffffe5, #f7fcb9, #d9f0a3, #addd8e, #78c679, #31a354, #006837)', ticks: ['0.1 (Bajo)', '0.4 (Medio)', '0.85 (Denso)'] },
            etReal: { title: '💦 Evapotranspiración Real ET (mm/8d)', gradient: 'linear-gradient(to right, #fff7ec, #fee8c8, #fdd49e, #fdbb84, #fc8d59, #ef6548, #d7301f, #990000)', ticks: ['0', '10', '20', '30', '40+ mm'] },
            etPot: { title: '☀️ Evapotranspiración Potencial PET (mm/8d)', gradient: 'linear-gradient(to right, #fff7ec, #fee8c8, #fdd49e, #fdbb84, #fc8d59, #ef6548, #d7301f, #990000)', ticks: ['0', '10', '20', '30', '40+ mm'] },
            p7d: { title: '🌧️ Pronóstico Lluvia Acumulada 7 Días (mm)', gradient: 'linear-gradient(to right, #e0f3f8, #91bfdb, #67a9cf, #2b8cbe, #045a8d, #023858)', ticks: ['0', '25', '50', '100', '150+ mm'] },
            p16d: { title: '🌧️ Pronóstico Lluvia Acumulada 16 Días (mm)', gradient: 'linear-gradient(to right, #e0f3f8, #91bfdb, #67a9cf, #2b8cbe, #045a8d, #023858)', ticks: ['0', '50', '100', '200', '300+ mm'] },
            gaussen: { title: '🔥 Déficit Ombrotérmico Gaussen (P < 2T)', gradient: 'linear-gradient(to right, #7f0000, #d73027, #f46d43, #fee08b, #e0f3f8, #67a9cf, #023858)', ticks: ['Déficit (-40)', 'Equilibrio (0)', 'Superávit (+20)'] },
            estres: { title: '🍂 Estrés Hídrico Foliar', gradient: 'linear-gradient(to right, #1a9850, #91cf60, #d9ef8b, #fee08b, #fc8d59, #d73027, #7f0000)', ticks: ['Saludable (0)', 'Estrés Medio', 'Estrés Severo (8)'] },
            martonne: { title: '🏜️ Índice de Aridez de De Martonne', gradient: 'linear-gradient(to right, #d7191c, #fdae61, #ffffbf, #abd9e9, #2c7bb6)', ticks: ['Árido (<10)', 'Semiárido', 'Subhúmedo', 'Húmedo (>30)'] },
            suscSequia: { title: '⚠️ Vulnerabilidad Forestal Compuesta (Sequía)', gradient: 'linear-gradient(to right, #006837, #31a354, #78c679, #addd8e, #d9ef8b, #fee08b, #fdae61, #f46d43, #d73027, #a50026)', ticks: ['Baja (0.1)', 'Media (0.4)', 'Alta (0.8)'] },
            suscHelada: { title: '❄️ Susceptibilidad a Heladas Forestales', gradient: 'linear-gradient(to right, #1f6888, #388385, #529688, #80a599, #d4c4b0, #b57448, #a0562e)', ticks: ['< 0° (Severa)', '4° (Moderada)', '> 12° (Sin riesgo)'] }
        };

        // 2. INICIALIZAR MAPA
        const map = L.map('map', {
            center: [15.5, -90.25],
            zoom: 7,
            maxZoom: 19,
            minZoom: 5
        });

        // 3. CAPA DE RELIEVE 3D HILLSHADE (ESRI WORLD HILLSHADE - GRATUITO Y RÁPIDO)
        const hillshadeLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            opacity: 0.65
        }).addTo(map);

        function toggleHillshade(isChecked) {
            if (isChecked) map.addLayer(hillshadeLayer);
            else map.removeLayer(hillshadeLayer);
        }

        // 4. MAPAS BASE
        const baseLayers = {
            sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map),
            topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
        };

        // 5. CAPAS INAB ARCGIS
        const inabLayers = {
            buffer: L.esri.featureLayer({ url: `${BASE_INAB}/GuatemalaBuffer1km/FeatureServer/0` }).addTo(map),
            municipios: L.esri.featureLayer({
                url: `${BASE_INAB}/Municipios_SubregionesINAB/FeatureServer/0`
            }).bindPopup(l => `<b>🗺️ Municipio:</b> ${l.feature.properties.mun || l.feature.properties.municipio || '-'}`),
            sequias: L.esri.featureLayer({
                url: `${BASE_INAB}/Susceptibilidad_a_sequ%C3%ADas/FeatureServer/17`
            }).bindPopup(l => `<b>🌵 Susceptibilidad:</b> ${l.feature.properties.categorias || '-'}`),
            incentivos: L.esri.featureLayer({
                url: `${BASE_INAB}/Incentivos_Forestales_INAB_Clima_vista/FeatureServer/0`
            }).bindPopup(l => `<b>🌲 Incentivo Forestal</b><br>Programa: ${l.feature.properties.programa || '-'}<br>Recarga: ${l.feature.properties.recarga_hidrica || '-'}`).addTo(map)
        };

        // 6. ANIMACIÓN GLOBAL Y LIGERA DE VIENTO (ESTILO WINDY PLANETARIO)
        let velocityLayer = null;
        let windAnimActive = true;

        const globalWindData = [{
            header: {
                parameterCategory: 2, parameterNumber: 2,
                nx: 36, ny: 18, basicAngle: 0, subDivisions: 0,
                lo1: -180.0, la1: 85.0, lo2: 180.0, la2: -85.0,
                dx: 10.0, dy: 10.0, date: "2026-09-28T18:00:00Z"
            },
            data: Array(648).fill(-4.2)
        }, {
            header: {
                parameterCategory: 2, parameterNumber: 3,
                nx: 36, ny: 18, basicAngle: 0, subDivisions: 0,
                lo1: -180.0, la1: 85.0, lo2: 180.0, la2: -85.0,
                dx: 10.0, dy: 10.0, date: "2026-09-28T18:00:00Z"
            },
            data: Array(648).fill(-1.5)
        }];

        function initWindAnimation() {
            velocityLayer = L.velocityLayer({
                displayValues: false,
                data: globalWindData,
                maxVelocity: 12,
                velocityScale: 0.003,
                particleAge: 140,
                particleMultiplier: 1 / 2500,
                lineWidth: 1.2,
                particleColor: '#e0f2fe',
                opacity: 0.65
            }).addTo(map);
        }

        function toggleWindAnimation() {
            windAnimActive = !windAnimActive;
            const btn = document.getElementById('btnAnimWind');
            btn.classList.toggle('active', windAnimActive);
            
            if (windAnimActive) {
                if (!velocityLayer) initWindAnimation();
                else map.addLayer(velocityLayer);
            } else {
                if (velocityLayer) map.removeLayer(velocityLayer);
            }
        }

        initWindAnimation();

        // 7. CONTROL DE CAPA GEE ACTIVA
        let currentGeeLayer = null;
        let activeGeeKey = 'precip';

        function activateGeeLayer(key) {
            if (currentGeeLayer) map.removeLayer(currentGeeLayer);
            
            activeGeeKey = key;
            currentGeeLayer = L.tileLayer(GEE_URLS[key], { 
                opacity: 0.78, 
                maxZoom: 19,
                className: 'gee-tile-layer'
            }).addTo(map);

            document.querySelectorAll('.right-gee-sidebar .gee-btn:not(.anim-btn):not(.contour-btn)').forEach(btn => btn.classList.remove('active'));
            if (event && event.currentTarget) event.currentTarget.classList.add('active');

            updateLegend(key);
        }

        function updateLegend(key) {
            const leg = LEGENDS[key] || { title: `Capa Climática: ${key}`, gradient: 'linear-gradient(to right, #000, #fff)', ticks: ['Min', 'Max'] };
            document.getElementById('legendTitle').textContent = leg.title;
            document.getElementById('legendGradient').style.background = leg.gradient;
            
            const ticksHtml = leg.ticks.map(t => `<span>${t}</span>`).join('');
            document.getElementById('legendTicks').innerHTML = ticksHtml;
        }

        activateGeeLayer('precip');

        // 8. LÓGICA DE CONTORNOS
        let isotermasActive = false;
        let isoyetasActive = false;

        function toggleContour(type) {
            if (type === 'isotermas') {
                isotermasActive = !isotermasActive;
                document.getElementById('btnIsotermas').classList.toggle('active', isotermasActive);
            } else {
                isoyetasActive = !isoyetasActive;
                document.getElementById('btnIsoyetas').classList.toggle('active', isoyetasActive);
            }
        }

        // 9. MENÚ HAMBURGUESA Y CAPAS INAB
        function toggleDrawer() {
            document.getElementById('inabDrawer').classList.toggle('open');
        }

        function toggleInabLayer(layerKey, isChecked) {
            if (isChecked) map.addLayer(inabLayers[layerKey]);
            else map.removeLayer(inabLayers[layerKey]);
        }

        function changeBaseMap(key) {
            Object.values(baseLayers).forEach(l => map.removeLayer(l));
            baseLayers[key].addTo(map);
        }

        // 10. PRONÓSTICO PUNTUAL HORIZONTAL
        let currentClickLat = null;
        let currentClickLon = null;

        function closeForecast() {
            document.getElementById('forecast-panel').style.display = 'none';
        }

        function switchForecastTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            fetchForecastData(currentClickLat, currentClickLon, tab);
        }

        map.on('click', function(e) {
            currentClickLat = e.latlng.lat;
            currentClickLon = e.latlng.lng;
            
            document.getElementById('forecast-panel').style.display = 'block';
            document.getElementById('forecast-coords').textContent = `Lat: ${currentClickLat.toFixed(4)}, Lon: ${currentClickLon.toFixed(4)}`;
            
            fetchForecastData(currentClickLat, currentClickLon, '7d');
        });

        async function fetchForecastData(lat, lon, range) {
            const grid = document.getElementById('forecast-grid');
            grid.innerHTML = '<div style="color:#aaa; padding:10px; font-size:12px;">Cargando datos del punto...</div>';

            const count = range === '7d' ? 8 : 16;
            try {
                const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&lang=es&appid=${OWM_KEY}`);
                if (!res.ok) throw new Error('Error al consultar API');
                const data = await res.json();
                
                let cards = '';
                data.list.slice(0, count).forEach(item => {
                    const date = new Date(item.dt_txt);
                    const dateStr = date.toLocaleDateString('es-GT', { weekday: 'short', day: 'numeric' }) + ' ' + date.getHours() + ':00';
                    const temp = Math.round(item.main.temp);
                    const desc = item.weather[0].description;
                    const rain = item.rain && item.rain['3h'] ? item.rain['3h'].toFixed(1) + ' mm' : '0 mm';
                    
                    cards += `
                        <div class="forecast-card">
                            <div class="time">${dateStr}</div>
                            <div class="temp">${temp}°C</div>
                            <div class="rain">${rain}</div>
                            <div class="desc">${desc}</div>
                        </div>
                    `;
                });
                grid.innerHTML = cards;
            } catch (err) {
                grid.innerHTML = '<div style="color:#ef4444; padding:10px; font-size:12px;">Error al consultar el pronóstico</div>';
            }
        }
    </script>
</body>
</html>
